<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>LogTint</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="LogTint" />
    <h1>LogTint</h1>
  </header>

  <label class="row">
    <span>Enabled globally</span>
    <input type="checkbox" id="globalEnabled" />
  </label>

  <label class="row">
    <span id="hostLabel">Disable on this site</span>
    <input type="checkbox" id="hostDisabled" />
  </label>

  <button id="rescanBtn">Re-scan page</button>

  <p class="hint">
    LogTint automatically colors text containing ANSI codes
    (e.g. <code>\u001b[32m</code>) on any page, in real time.
  </p>

  <script src="popup.js"></script>
</body>
</html>
