<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LogTint - demo</title>
  <style>
    body { background: #1e1e1e; color: #ddd; font-family: monospace; padding: 20px; }
    h1 { color: #fff; font-family: sans-serif; }
    pre { white-space: pre-wrap; word-break: break-all; }
    button { margin: 8px 0; padding: 6px 12px; }
  </style>
</head>
<body>
  <h1>LogTint - test page</h1>
  <p>Load the unpacked extension from <code>chrome://extensions</code> and reload this page.</p>

  <h3>Static log (already present when the page loads)</h3>
  <pre id="staticLog"></pre>

  <h3>Streaming log (simulated, one new line per second)</h3>
  <pre id="streamLog"></pre>
  <button id="startStream">Start streaming</button>

  <script>
    const ESC = "\u001b[";
    const sample =
      ESC + "32m[Nest] 1  - " + ESC + "39m09/11/2026, 8:56:51 AM " + ESC + "32m    LOG" + ESC + "39m " +
      ESC + "38;5;3m[AuthenticationCommon] " + ESC + "39m" + ESC + "32mAuthenticated user gigyaUid: f05487e821704cfb8c14c5e5d5e138c0" + ESC + "39m";

    document.getElementById("staticLog").textContent = sample + "\n" +
      ESC + "1;31mERROR" + ESC + "0m " + ESC + "4mconnection refused" + ESC + "0m";

    const streamEl = document.getElementById("streamLog");
    let n = 0;
    document.getElementById("startStream").addEventListener("click", () => {
      setInterval(() => {
        n++;
        const line = document.createTextNode(
          ESC + "32mLOG" + ESC + "39m streaming line #" + n + " " +
          ESC + "38;5;3m[Worker] " + ESC + "39mprocessing...\n"
        );
        streamEl.appendChild(line);
      }, 1000);
    });
  </script>
</body>
</html>
